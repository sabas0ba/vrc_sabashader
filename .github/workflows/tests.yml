name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "ゴールデン画像を生成してアーティファクトに上げる（比較はしない）"
        type: boolean
        default: false

jobs:
  shader-regression:
    name: シェーダー回帰テスト
    runs-on: ubuntu-24.04
    env:
      # llvmpipe を確実に使う（ランナーに GPU は無い）
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: ヘッドレス OpenGL を用意する
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgl1-mesa-dri libglvnd0

      - name: 依存パッケージを入れる
        run: pip install -r tests/requirements.txt

      - name: レンダラを表示する
        run: python -c "import sys; sys.path.insert(0, 'tests'); from harness.render import renderer_info; print(renderer_info())"

      - name: テストを実行する
        if: ${{ inputs.update_goldens != true }}
        run: python -m pytest tests -q

      # ゴールデン画像は llvmpipe で作る必要がある。手元の GPU で作ると
      # ドライバ差で CI と一致しないので、生成もこのランナーで行う。
      - name: ゴールデン画像を生成する
        if: ${{ inputs.update_goldens == true }}
        run: python -m pytest tests -k render -q --update-goldens

      - name: ゴールデン画像をアップロードする
        if: ${{ inputs.update_goldens == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goldens
          path: tests/golden/
          retention-days: 14

      - name: 差分画像をアップロードする
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-diff
          path: _test_artifacts/
          if-no-files-found: ignore
          retention-days: 14
