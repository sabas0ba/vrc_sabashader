name: build listing

on:
  # main への merge で docs とサイトの見た目を、リリースの公開で index.json の
  # バージョン一覧を、それぞれ反映する。手で流すこともできる。
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: index.json を作る
    runs-on: ubuntu-24.04
    steps:
      # サイトの中身は常に main から作る。release イベントの既定はタグの
      # コミットなので、古いタグのリリースを公開すると docs が巻き戻る。
      # index.json は checkout ではなく Releases API から組むため、
      # main を見てもバージョン一覧は最新のままになる。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      # tools は手元と同じコンテナの中で動かす。ランナーに Python を入れない。
      - name: コンテナを組み立てる
        run: docker build -t vrc-sabashader-dev -f Containerfile .

      - name: リスティングと docs を組み立てる
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e GITHUB_TOKEN vrc-sabashader-dev \
            python tools/build_listing.py \
              --output _site/index.json \
              --html _site/index.html \
              --docs _site/docs
          cat _site/index.json

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: GitHub Pages に配信する
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
