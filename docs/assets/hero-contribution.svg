<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SabaShader にシェーダーとモジュールを追加する流れ</title>
  <desc id="desc">ファイル構成、Unity 非依存の数式、回帰テスト、配布確認の流れ</desc>
  <rect width="1200" height="420" rx="28" fill="#1a2632"/>
  <g font-family="system-ui, sans-serif" fill="#f8fafc">
    <text x="52" y="62" font-size="28" font-weight="700">Contribution workflow</text>
    <text x="52" y="95" font-size="17" fill="#b9c6d8">実装を配置し、数式・構造・配布を同じ検証経路に通す</text>
    <g transform="translate(55 150)">
      <rect width="230" height="155" rx="18" fill="#29445a" stroke="#9ec4e5" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700">1. 配置</text><text x="24" y="82" font-size="16" fill="#c5d9e8">scshader / scmodule</text><text x="24" y="112" font-size="16" fill="#c5d9e8">properties / phases</text>
    </g>
    <path d="M305 228h55" stroke="#8bd5ca" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(380 150)">
      <rect width="230" height="155" rx="18" fill="#33445c" stroke="#b1c2e6" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700">2. 数式</text><text x="24" y="82" font-size="16" fill="#d5def0">Core.hlsl</text><text x="24" y="112" font-size="16" fill="#d5def0">Unity 非依存</text>
    </g>
    <path d="M630 228h55" stroke="#8bd5ca" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(705 150)">
      <rect width="205" height="155" rx="18" fill="#3c514e" stroke="#a8d6c9" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700">3. 検証</text><text x="24" y="82" font-size="16" fill="#d0eee7">render / structure</text><text x="24" y="112" font-size="16" fill="#d0eee7">Unity compile</text>
    </g>
    <path d="M930 228h55" stroke="#8bd5ca" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1005 150)">
      <rect width="145" height="155" rx="18" fill="#5b493d" stroke="#f0c693" stroke-width="2"/><text x="24" y="42" font-size="18" font-weight="700">4. 配布</text><text x="24" y="82" font-size="16" fill="#f1dcc3">meta</text><text x="24" y="112" font-size="16" fill="#f1dcc3">release</text>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#8bd5ca"/></marker></defs>
</svg>
