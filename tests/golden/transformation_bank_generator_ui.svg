<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Transformation Bank Clip Generator UI</title>
  <desc id="desc">衣装AとB、VFX Style、遷移時間、Material互換性、生成操作の位置と役割を示すUI概略図。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#080b10" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#27313f"/>
      <stop offset="1" stop-color="#1d2531"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", "Noto Sans JP", sans-serif; fill: #edf2f8; }
      .label { font-size: 18px; fill: #c8d0db; }
      .value { font-size: 18px; fill: #f7f9fc; }
      .small { font-size: 15px; fill: #aeb9c7; }
      .section { font-size: 21px; font-weight: 650; }
      .callout-title { font-size: 20px; font-weight: 700; }
      .callout-body { font-size: 16px; fill: #c9d4e2; }
      .field { fill: #202731; stroke: #596675; stroke-width: 1.5; }
      .line { stroke: #66778b; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#11161d"/>
  <text x="60" y="55" font-size="28" font-weight="700">Transformation Bank Clip Generator — UI guide</text>
  <text x="60" y="85" class="small">Tools &gt; SabaShader &gt; Transformation Bank Clip Generator</text>

  <g filter="url(#shadow)">
    <rect x="55" y="115" width="860" height="805" rx="10" fill="#2b3038" stroke="#5a6572" stroke-width="2"/>
    <path d="M65 115h840a10 10 0 0 1 10 10v42H55v-42a10 10 0 0 1 10-10z" fill="url(#header)"/>
    <text x="82" y="149" font-size="20" font-weight="650">Transformation Bank Clips</text>

    <rect x="78" y="184" width="814" height="56" rx="5" fill="#1e3445" stroke="#42637c"/>
    <text x="96" y="207" class="small">Clip生成は元Scene／Material／Animator Controllerを変更しません。</text>
    <text x="96" y="229" class="small">Material互換性の割当操作だけが対象Renderer Slotを変更します。</text>

    <text x="82" y="278" class="label">Avatar Root</text>
    <rect x="270" y="253" width="600" height="34" rx="4" class="field"/>
    <text x="286" y="276" class="value">Avatar_Root</text>
    <text x="82" y="322" class="label">衣装 A</text>
    <rect x="270" y="297" width="600" height="34" rx="4" class="field"/>
    <text x="286" y="320" class="value">Outfit_Old</text>
    <text x="82" y="366" class="label">衣装 B</text>
    <rect x="270" y="341" width="600" height="34" rx="4" class="field"/>
    <text x="286" y="364" class="value">Outfit_New</text>

    <line x1="78" y1="396" x2="892" y2="396" stroke="#434c58"/>
    <text x="82" y="431" class="label">VFX Style</text>
    <rect x="270" y="406" width="600" height="34" rx="4" class="field"/>
    <text x="286" y="429" class="value">Flame</text>
    <path d="M842 419l8 8 8-8" class="line"/>
    <text x="82" y="475" class="label">遷移時間 (秒)</text>
    <rect x="270" y="450" width="600" height="34" rx="4" class="field"/>
    <text x="286" y="473" class="value">2.0</text>
    <text x="82" y="519" class="label">Effect Intensity</text>
    <line x1="286" y1="512" x2="740" y2="512" stroke="#737f8c" stroke-width="4"/>
    <line x1="286" y1="512" x2="470" y2="512" stroke="#4fb6e9" stroke-width="4"/>
    <circle cx="470" cy="512" r="9" fill="#e9f7ff" stroke="#4fb6e9" stroke-width="3"/>
    <rect x="760" y="494" width="110" height="34" rx="4" class="field"/>
    <text x="778" y="517" class="value">1.6</text>
    <text x="82" y="563" class="label">Style推奨値を適用</text>
    <rect x="270" y="543" width="22" height="22" rx="3" fill="#4ea6d8" stroke="#9ad9fb"/>
    <path d="M276 554l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="82" y="607" class="label">出力先</text>
    <rect x="270" y="582" width="510" height="34" rx="4" class="field"/>
    <text x="286" y="605" class="value">Assets/SabaShader/TransformationBank</text>
    <rect x="790" y="582" width="80" height="34" rx="4" fill="#3b4653" stroke="#738092"/>
    <text x="814" y="605" class="value">選択</text>

    <rect x="78" y="640" width="814" height="214" rx="6" fill="#252b33" stroke="#697583"/>
    <text x="96" y="674" class="section">Material互換性</text>
    <rect x="760" y="651" width="112" height="30" rx="4" fill="#3b4653" stroke="#738092"/>
    <text x="784" y="672" class="small">再スキャン</text>
    <rect x="95" y="692" width="780" height="39" rx="4" fill="#4a361c" stroke="#9c732e"/>
    <text x="110" y="717" class="small" fill="#ffdb91">1件のMaterial SlotでTransformation Bankを利用できません。</text>
    <text x="96" y="759" class="label">生成元Shader</text>
    <rect x="270" y="737" width="600" height="31" rx="4" class="field"/>
    <text x="286" y="759" class="small">SabaShader/Illust2D — Packages/.../Illust2D.scshader</text>
    <text x="96" y="801" class="small">衣装A / Outfit_Old/Body / Slot 0　現在: Standard　不足: Progress, Role, Style, EffectIntensity</text>
    <rect x="96" y="814" width="370" height="30" rx="4" fill="#3c657d" stroke="#79bde1"/>
    <text x="168" y="835" class="small" fill="#ffffff">互換Materialを生成して割当</text>
    <rect x="480" y="814" width="390" height="30" rx="4" fill="#3b4653" stroke="#738092"/>
    <text x="595" y="835" class="small">選択Materialを割当</text>

    <rect x="78" y="870" width="814" height="34" rx="4" fill="#3c657d" stroke="#7ac1e8" stroke-width="1.5"/>
    <text x="382" y="893" class="value" font-weight="650">Animation Clipを生成</text>
  </g>

  <g>
    <path d="M916 279h44" class="line"/>
    <circle cx="980" cy="279" r="18" fill="#4fb6e9"/><text x="974" y="286" font-size="19" font-weight="700">1</text>
    <text x="1010" y="269" class="callout-title">対象を指定</text>
    <text x="1010" y="293" class="callout-body">Avatar Rootはbinding pathの基準。</text>
    <text x="1010" y="316" class="callout-body">衣装A/Bには衣装rootを指定します。</text>

    <path d="M916 445h44" class="line"/>
    <circle cx="980" cy="445" r="18" fill="#a478e8"/><text x="974" y="452" font-size="19" font-weight="700">2</text>
    <text x="1010" y="435" class="callout-title">演出を指定</text>
    <text x="1010" y="459" class="callout-body">Styleは演出方式、遷移時間はClip長。</text>
    <text x="1010" y="482" class="callout-body">Intensityは発光・変位・pattern量です。</text>

    <path d="M916 585h44" class="line"/>
    <circle cx="980" cy="585" r="18" fill="#efb04f"/><text x="974" y="592" font-size="19" font-weight="700">3</text>
    <text x="1010" y="575" class="callout-title">出力先</text>
    <text x="1010" y="599" class="callout-body">Clip、Role Material、Reportを保存。</text>
    <text x="1010" y="622" class="callout-body">再生成時は一意なFolderになります。</text>

    <path d="M916 722h44" class="line"/>
    <circle cx="980" cy="722" r="18" fill="#ed7c7c"/><text x="974" y="729" font-size="19" font-weight="700">4</text>
    <text x="1010" y="706" class="callout-title">互換性を修復</text>
    <text x="1010" y="730" class="callout-body">対応Shaderから複製Materialを作るか、</text>
    <text x="1010" y="753" class="callout-body">既存対応MaterialをSlotへ割り当てます。</text>
    <text x="1010" y="776" class="callout-body">元Materialアセットは変更しません。</text>

    <path d="M916 887h44" class="line"/>
    <circle cx="980" cy="887" r="18" fill="#6fcf97"/><text x="974" y="894" font-size="19" font-weight="700">5</text>
    <text x="1010" y="877" class="callout-title">生成</text>
    <text x="1010" y="901" class="callout-body">A→B / B→Aの2 ClipとRole Material、</text>
    <text x="1010" y="924" class="callout-body">Generation Reportを作成します。</text>
  </g>
</svg>
